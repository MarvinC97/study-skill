name: Study Host-Native regression
on:
  push:
    branches: [fix/v6.2-g2-g6-quality-gates]
  pull_request:
    paths:
      - 'study/runtime/**'
      - '.github/workflows/v61-regression.yml'
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile changed Python files
        run: python -m compileall -q study/runtime
      - name: Learner continuity and regression tests (offline)
        run: python -m unittest discover -s study/runtime/v61tests -p 'test_*.py' -v
      - name: Host-native pipeline and independence gates (offline)
        run: python -m unittest discover -s study/runtime/v6tests -p 'test_agent_host.py' -v
      - name: Standard Unit integration without external API
        run: python -m unittest discover -s study/runtime/v6tests -p 'test_agent_integration.py' -v
      - name: Strict G2-G6 negative quality acceptance tests
        run: python -m unittest discover -s study/runtime/v6tests -p 'test_quality_gates.py' -v
      - name: Reject reintroduction of standalone provider requirements
        run: python -m unittest discover -s study/runtime/v6tests -p 'test_no_provider_api.py' -v
