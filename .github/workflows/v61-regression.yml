name: Study V6.5 design-first regression
on:
  push:
    branches: [feat/v6.5-lesson-design-quality]
  pull_request:
    paths:
      - 'study/runtime/**'
      - '.github/workflows/v61-regression.yml'
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile changed Python files
        run: python -m compileall -q study/runtime
      - name: Learner continuity and regression tests (offline)
        run: python -m unittest discover -s study/runtime/v61tests -p 'test_*.py' -v
      - name: Host-native pipeline and independence gates (offline)
        run: python -m unittest discover -s study/runtime/v6tests -p 'test_agent_host.py' -v
      - name: Standard Unit integration without external API
        run: python -m unittest discover -s study/runtime/v6tests -p 'test_agent_integration.py' -v
      - name: Strict G2-G6 negative quality acceptance tests
        run: python -m unittest discover -s study/runtime/v6tests -p 'test_quality_gates.py' -v
      - name: Grouped LPs, scoped G2 reviews and compact G4 cache
        run: python -m unittest discover -s study/runtime/v6tests -p 'test_incremental_quality.py' -v
      - name: Standard Study Unit grouping versus deep focused-page regression
        run: python -m unittest discover -s study/runtime/v6tests -p 'test_study_modes.py' -v
      - name: Lesson-design gate, reviewer hash, visual-kind negative tests
        run: python -m unittest discover -s study/runtime/v6tests -p 'test_lesson_design.py' -v
      - name: Install deterministic browser QA dependencies
        run: |
          python -m pip install playwright pyyaml beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Actual Chromium QA of generated fixture HTML
        run: python -m unittest discover -s study/runtime/tests -p 'test_runtime.py' -v
      - name: Incremental page-by-page browser and delivery acceptance
        run: python -m unittest discover -s study/runtime/tests -p 'test_incremental_stage.py' -v
      - name: Three teaching-shape pilots with actual Chromium
        run: python -m unittest discover -s study/runtime/tests -p 'test_lesson_visuals.py' -v
      - name: Storyboard composition, source mapping and component validation
        run: python -m unittest discover -s study/runtime/v6tests -p 'test_storyboard_components.py' -v
      - name: Actual Chromium component interactions and screenshot-bound Render Review
        run: python -m unittest discover -s study/runtime/tests -p 'test_storyboard_browser.py' -v
      - name: Skill metadata and reference integrity
        run: python study/tests/validate_skill.py
      - name: Reject reintroduction of standalone provider requirements
        run: python -m unittest discover -s study/runtime/v6tests -p 'test_no_provider_api.py' -v
