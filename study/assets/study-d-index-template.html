<!doctype html>
<html lang="zh-CN">
<!-- TEMPLATE CONTRACT (Study V3.0)
Default learner language is zh-CN; change html lang and UI labels when requested.
Retain source English terms, identifiers, API names and quoted source text accurately.
Replace every placeholder before delivery. Escape text/attribute values; validate
navigation URLs. HTML slots accept only trusted authored markup, never raw source
HTML, scripts or event attributes. Keep source quotations as text, not executable code.
Use textContent for runtime source strings. No remote dependencies or network calls.
Test the generated artifact, not only this template, on mobile and without JavaScript.

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TOPIC}} · Study-D</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#17201d;--muted:#68736f;--line:#dde3df;--accent:#315f78}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1000px;margin:auto;padding:28px 18px 56px}.top{color:var(--muted);font-size:14px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin-top:16px}.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.05;margin:.2em 0}.model{font-size:clamp(18px,2.5vw,26px);font-weight:700;white-space:pre-wrap}.pages{display:grid;gap:12px}.pages a{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:14px;padding:16px;background:#fbfcfb}.pages b{color:var(--accent)}small{color:var(--muted)}

/* Shared resilience: narrow screens, keyboard use and reduced motion. */
main,section,article,.card,.panel{min-width:0}body{overflow-wrap:anywhere}
img,svg,video{max-width:100%;height:auto}pre{max-width:100%;overflow:auto}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #287ea5;outline-offset:4px}
button,input,select,summary{font:inherit}button,select,summary{min-height:44px}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body><main>
<div class="top">{{SOURCE_LOCATOR}} · Study-D</div>
<section class="hero"><h1>{{TOPIC}}</h1><p>{{ONE_LINE_PURPOSE}}</p><div class="model">{{WHOLE_MENTAL_MODEL}}</div></section>
<section class="card"><h2>学习地图</h2><div class="pages">{{PAGE_LINKS}}</div></section>
<section class="card"><h2>回到主线</h2><p>{{RETURN_POINT}}</p></section>
</main></body></html>
